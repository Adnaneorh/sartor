# Dependabot — weekly dependency update PRs for all three ecosystems.
# Activates once the repo is pushed to GitHub.
version: 2
updates:
  # Next.js app — package.json lands at the repo root in Phase 0.2.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # Python worker — /worker per the monorepo target layout in CLAUDE.md
  # (folder created in Phase 2.1; Railway deploys it via root-directory setting).
  - package-ecosystem: "pip"
    directory: "/worker"
    schedule:
      interval: "weekly"

  # Keeps .github/workflows action versions (e.g. actions/checkout) current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
