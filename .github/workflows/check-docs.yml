name: docs-consistency

# Pass 2 of the CLAUDE.md verification protocol: the docs consistency check
# runs on every push and PR so it can never be forgotten.
on:
  push:
  pull_request:

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run docs consistency check
        run: bash scripts/check-docs.sh
